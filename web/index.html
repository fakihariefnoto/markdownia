<!DOCTYPE html>
<html lang="en" data-theme="light" data-reading-theme="paper" data-accent="teal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdownia</title>
  <style>
    /* Splash — inline so it shows before any JS or CSS loads. Follows the
       theme via the data-theme attribute set on <html>. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #F9FAFB;
      color: #17191C;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.35s ease-in-out;
    }
    [data-theme="dark"] #splash {
      background: #161C1D;
      color: #F1F3F4;
    }
    #splash .splash-mark {
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #splash .splash-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #splash .splash-name {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    #splash .splash-tagline {
      font-size: 13px;
      font-weight: 400;
      color: rgba(23,25,28,0.6);
      text-align: center;
      max-width: 360px;
      line-height: 1.5;
    }
    [data-theme="dark"] #splash .splash-tagline {
      color: rgba(241,243,244,0.6);
    }
    #splash .splash-bar {
      width: 180px;
      height: 3px;
      border-radius: 999px;
      background: rgba(0,0,0,0.12);
      overflow: hidden;
    }
    [data-theme="dark"] #splash .splash-bar {
      background: rgba(255,255,255,0.12);
    }
    #splash .splash-bar::after {
      content: '';
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: #0E7490;
      animation: splash-sweep 1.1s ease-in-out infinite;
    }
    [data-theme="dark"] #splash .splash-bar::after {
      background: #2EC2EB;
    }
    @keyframes splash-sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(450%); }
    }
    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-mark"><img src="/src/assets/markdownia.png" alt="Markdownia"></div>
    <div class="splash-name">Markdownia</div>
    <div class="splash-tagline">Turn any pile of markdown into a beautifully rendered reading library.</div>
    <div class="splash-bar"></div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
