# Markdownia release workflow (build/tasks/08)
# Triggered by workflow_dispatch ONLY — consistent with this repo's convention
# that nothing runs automatically on push or PR.
#
# Three GitHub-hosted runners (the documented infra exception — a Linux VPS
# cannot produce a signed macOS .app). Each job installs its packaging
# toolchain and asserts its named artifact exists and is non-trivial in size:
# a missing NSIS silently ships no installer, so a green build that shipped
# nothing is the specific failure this guards against.
#
# Single Go module at the repo root (no backend/ directory).

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.0.1)'
        required: true

env:
  GO_VERSION: '1.26'
  BUN_VERSION: '1.2'

jobs:
  go-ci:
    name: Lint / security / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install tooling
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Lint
        run: make lint
      - name: Security
        run: make security
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Test
        run: make test

  macos:
    name: macOS .app + .dmg
    runs-on: macos-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.7
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build .app (universal)
        run: wails3 task darwin:package:universal
      - name: Build .dmg
        run: wails3 task darwin:create:dmg
      - name: Sign .app
        run: |
          codesign --force --deep --options runtime --sign "$APPLE_CERT" bin/markdownia.app
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERT }}
      - name: Notarize and staple
        run: |
          xcrun notarytool submit bin/markdownia.dmg --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple bin/markdownia.app
          xcrun stapler staple bin/markdownia.dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Assert artifacts exist
        run: |
          test -s bin/markdownia.app/Contents/MacOS/markdownia || exit 1
          test -s bin/markdownia.dmg || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            bin/markdownia.app
            bin/markdownia.dmg

  windows:
    name: Windows NSIS installer + portable
    runs-on: windows-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.7
      - name: Install NSIS
        run: winget install NSIS.NSIS
      - name: Build + package (NSIS installer + portable)
        run: wails3 task windows:package
      - name: Assert installer exists
        run: |
          test -s bin/markdownia-amd64-installer.exe || exit 1
          test -s bin/markdownia.exe || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            bin/markdownia-amd64-installer.exe
            bin/markdownia.exe

  linux:
    name: Linux .AppImage + .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          version: ${{ env.BUN_VERSION }}
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.7
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Package (.deb + .rpm via wails Taskfile)
        run: wails3 task linux:package
      - name: Assert artifacts exist
        run: |
          test -s bin/markdownia.deb || exit 1
          test -s bin/markdownia.rpm || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            bin/markdownia.deb
            bin/markdownia.rpm

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [go-ci, macos, windows, linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          cd artifacts
          find . -type f | sort | xargs sha256sum > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
